name: Build Drink Runtime (DRE)
on: [push]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            out_name: DrinkRuntimeEnvironment.exe
          - os: ubuntu-latest
            out_name: DrinkRuntimeEnvironment-linux
          - os: macos-latest
            out_name: DrinkRuntimeEnvironment-mac
    steps:
    - uses: actions/checkout@v4
    
    # Устанавливаем компилятор для Windows (для Linux и Mac он уже есть)
    - name: Setup MinGW (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install mingw -y
        echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
    # Компилируем (для Windows используем gcc, для Mac clang, для Linux gcc)
    - name: Compile DRE
      run: |
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          clang drink_vm.c -o ${{ matrix.out_name }} -static
        else
          gcc drink_vm.c -o ${{ matrix.out_name }} -static
        fi
      shell: bash

    # Загружаем готовый файл
    - uses: actions/upload-artifact@v4
      with:
        name: DRE-${{ matrix.os }}
        path: ${{ matrix.out_name }}
